name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version metadata
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION_NAME="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/glassrack-release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "mode=repository-secret" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; generating ephemeral CI keystore."
            EPHEMERAL_PASS="glassrack-ephemeral-ci"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -alias glassrack-ephemeral \
              -storepass "$EPHEMERAL_PASS" \
              -keypass "$EPHEMERAL_PASS" \
              -dname "CN=Glassrack CI, OU=Homelab, O=Glassrack, L=Local, ST=Local, C=US"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=glassrack-ephemeral" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        run: ./gradlew testAndroidHostTest --no-daemon

      - name: Build release APK and AAB
        env:
          GLASSRACK_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GLASSRACK_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease --no-daemon \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version_name }}"
          APK_SRC=$(find androidApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_SRC=$(find androidApp/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$APK_SRC" ] || [ -z "$AAB_SRC" ]; then
            echo "Missing release APK or AAB"
            exit 1
          fi
          cp "$APK_SRC" "dist/glassrack-${VERSION}-release.apk"
          cp "$AAB_SRC" "dist/glassrack-${VERSION}-release.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Glassrack ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/glassrack-${{ steps.version.outputs.version_name }}-release.apk
            dist/glassrack-${{ steps.version.outputs.version_name }}-release.aab
            dist/SHA256SUMS.txt
